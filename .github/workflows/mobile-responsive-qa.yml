name: Mobile Responsive QA

on:
  push:
    branches: [dev]
    paths:
      - 'fragments/**'
      - 'src/**'
      - 'index.html'
      - 'tests/visual/**'
      - 'package.json'
      - '.github/workflows/mobile-responsive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Start local landing server
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/plinio-http.log 2>&1 &
          echo $! > /tmp/plinio-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/plinio-http.log
          exit 1

      - name: Run real Chromium mobile emulation QA
        run: npm run test:mobile

      - name: Upload mobile screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-qa
          path: artifacts/mobile-qa
          if-no-files-found: warn
          retention-days: 14
