<header class="pl-header pl-v5-header pl-v2-header" data-head="1">
  <div class="pl-container pl-header__inner pl-v2-header__inner">
    <a href="#top" class="pl-header__brand pl-v2-header__brand" aria-label="Plinio, torna all'inizio">
      <img src="./brand-kit/logo.png" alt="" class="pl-header__logo-img pl-v2-header__logo" width="42" height="42">
      <span class="pl-header__logo-text pl-v2-header__name">Plinio</span>
    </a>

    <nav class="pl-header__nav pl-v2-header__nav" aria-label="Navigazione principale">
      <a href="#come-funziona">Come funziona</a>
      <a href="#confronto">Perché Plinio</a>
      <a href="#demo-opportunita">Esempi</a>
      <a href="#faq">FAQ</a>
    </nav>

    <div class="pl-v2-header__actions">
      <a href="./admin.html" class="pl-v2-header__login">Accedi</a>
      <button
        type="button"
        class="pl-btn pl-v2-header__pilot"
        data-header-cta="1"
        data-open-lead-modal
        data-analytics-event="pilot_cta_click"
        data-analytics-location="header"
      >Prova Plinio su un progetto</button>
    </div>

    <details class="pl-v2-mobile-menu">
      <summary aria-label="Apri il menu di navigazione">
        <span></span><span></span><span></span>
      </summary>
      <div class="pl-v2-mobile-menu__panel">
        <nav aria-label="Navigazione mobile">
          <a href="#come-funziona">Come funziona</a>
          <a href="#confronto">Perché Plinio</a>
          <a href="#demo-opportunita">Esempi</a>
          <a href="#faq">FAQ</a>
        </nav>
        <div class="pl-v2-mobile-menu__actions">
          <a href="./admin.html" class="pl-v2-header__login">Accedi</a>
          <button
            type="button"
            class="pl-btn pl-v2-header__pilot"
            data-open-lead-modal
            data-analytics-event="pilot_cta_click"
            data-analytics-location="header_mobile"
          >Prova Plinio su un progetto</button>
        </div>
      </div>
    </details>
  </div>
</header>
