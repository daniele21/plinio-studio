<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Plinio Content Studio: contenuto pronto</title>
<desc id="desc">Schermata Plinio con contenuto pronto da modificare o approvare, preview LinkedIn, target e fonti collegate.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b0d0e"/><stop offset="1" stop-color="#111314"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf1"/><stop offset="1" stop-color="#f6ecdf"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".22"/></filter>
  <style>
    .ui{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.cream{fill:#fff8ec}.muted{fill:#c7beb1}.orange{fill:#f15a24}.nav{font-size:18px;fill:#eee7dc}.body{font-size:17px;fill:#2b2926}.tiny{font-size:13px}.small{font-size:15px}.label{font-size:13px;font-weight:700;letter-spacing:.6px;fill:#55504a}.green{fill:#62d698}.paperText{fill:#24211e}.btnText{font-size:16px;font-weight:700;fill:#fff}
  </style>
</defs>
<rect width="1536" height="1024" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="244" height="1024" fill="#0a0c0d"/><line x1="244" y1="0" x2="244" y2="1024" stroke="#2b2b29"/>
<!-- brand/nav same as Radar -->
<circle cx="49" cy="55" r="22" fill="none" stroke="#e8d1b4" stroke-width="2"/><circle cx="49" cy="55" r="8" fill="#f15a24"/><ellipse cx="49" cy="55" rx="34" ry="13" fill="none" stroke="#e8d1b4" stroke-width="1.6" transform="rotate(-30 49 55)"/>
<text x="82" y="58" class="serif cream" font-size="36">Plinio</text><text x="84" y="84" class="serif orange" font-size="21" letter-spacing="6">Studio</text>
<rect x="12" y="132" width="218" height="58" rx="10" fill="#252321"/><text x="28" y="169" class="ui nav orange" font-weight="700">▦  Studio</text>
<text x="28" y="230" class="ui nav">▤  Knowledge Base</text><text x="28" y="286" class="ui nav">▦  Piano Editoriale</text><text x="28" y="342" class="ui nav">⬡  Review Queue</text><circle cx="213" cy="335" r="14" fill="#f15a24"/><text x="209" y="340" class="ui" fill="#fff" font-size="13">1</text>
<text x="28" y="398" class="ui nav">⚙  Impostazioni</text><text x="28" y="454" class="ui nav">♙  Admin</text><line x1="24" y1="760" x2="220" y2="760" stroke="#34322f"/><text x="28" y="804" class="ui nav">☼  Aspetto</text><line x1="24" y1="842" x2="220" y2="842" stroke="#34322f"/><circle cx="49" cy="885" r="20" fill="none" stroke="#f15a24"/><text x="38" y="890" class="ui orange" font-size="14">SR</text><text x="77" y="880" class="ui nav" font-size="16">Sofia Rinaldi</text><text x="77" y="903" class="ui muted" font-size="14">Account</text>
<!-- top -->
<text x="282" y="48" class="ui orange" font-size="16">← Torna al Radar</text><text x="282" y="92" class="serif cream" font-size="38">Migliorare l’efficienza operativa</text><rect x="704" y="61" width="132" height="36" rx="18" fill="#10271c" stroke="#2f8c60"/><text x="731" y="84" class="ui green" font-size="14" font-weight="700">✓ Contenuto pronto</text><text x="282" y="126" class="ui muted" font-size="17">Ridurre i tempi ciclo del 12% e migliorare l’allineamento tra funzioni.</text>
<rect x="282" y="145" width="108" height="34" rx="17" fill="#17191a" stroke="#353331"/><text x="305" y="167" class="ui cream" font-size="14">◎ operations</text><rect x="400" y="145" width="124" height="34" rx="17" fill="#17191a" stroke="#353331"/><text x="422" y="167" class="ui cream" font-size="14">♙ procurement</text><rect x="534" y="145" width="90" height="34" rx="17" fill="#17191a" stroke="#353331"/><text x="556" y="167" class="ui green" font-size="14">✓ 1 card</text>
<text x="1390" y="48" class="ui cream" font-size="16">?  Guida di Plinio</text>
<!-- stepper -->
<rect x="282" y="194" width="884" height="76" rx="14" fill="#151718" stroke="#303234"/><circle cx="318" cy="231" r="13" fill="#10271c" stroke="#4bc17f"/><text x="314" y="236" class="ui green" font-size="14">✓</text><text x="344" y="225" class="ui cream" font-size="15">Radar</text><text x="344" y="247" class="ui muted" font-size="13">Opportunità trovata</text><line x1="490" y1="231" x2="628" y2="231" stroke="#625539"/>
<circle cx="666" cy="231" r="15" fill="#f15a24"/><text x="661" y="236" class="ui" fill="#fff" font-size="14">2</text><text x="694" y="225" class="ui orange" font-size="15" font-weight="700">Contenuto pronto</text><text x="694" y="247" class="ui muted" font-size="13">Rivedi e personalizza</text><line x1="856" y1="231" x2="954" y2="231" stroke="#343638"/><circle cx="986" cy="231" r="15" fill="none" stroke="#5b5c5d"/><text x="981" y="236" class="ui muted" font-size="14">3</text><text x="1014" y="225" class="ui muted" font-size="15">Pubblicazione</text><text x="1014" y="247" class="ui muted" font-size="13">Scegli canale e pubblica</text>
<!-- editor -->
<g filter="url(#shadow)"><rect x="282" y="286" width="884" height="650" rx="16" fill="url(#paper)"/></g>
<rect x="300" y="304" width="90" height="38" rx="8" fill="#ed551f"/><text x="320" y="329" class="ui" fill="#fff" font-size="14" font-weight="700">Contenuto</text><text x="408" y="329" class="ui paperText" font-size="14">Impostazioni</text><text x="986" y="329" class="ui" fill="#6a645d" font-size="13">Cronologia versioni  ·  Versione 1.2</text>
<line x1="300" y1="354" x2="1144" y2="354" stroke="#d8c9b7"/><text x="310" y="386" class="ui paperText" font-size="16">H1   B   I   U    ≡   ≣    ↗    ▦      ◎ Inserisci claim</text><text x="1062" y="386" class="ui" fill="#3b7258" font-size="14">Salvato ✓</text><line x1="300" y1="402" x2="1144" y2="402" stroke="#dfd2c2"/>
<text x="308" y="430" class="ui label">TITOLO</text><text x="308" y="466" class="serif paperText" font-size="27">Come ridurre i tempi ciclo del 12%</text><text x="308" y="498" class="serif paperText" font-size="27">e migliorare l’allineamento tra funzioni</text><line x1="308" y1="515" x2="1138" y2="515" stroke="#e4d7c7"/>
<text x="308" y="542" class="ui label">INTRODUZIONE</text><text x="308" y="574" class="ui body">Dai progetti analizzati emerge un pattern chiaro: le inefficienze non sono dovute</text><text x="308" y="599" class="ui body">alla mancanza di strumenti, ma alla frammentazione delle informazioni e alla</text><text x="308" y="624" class="ui body">mancanza di visibilità sui colli di bottiglia.</text>
<text x="308" y="662" class="ui label">LE 3 LEVE CHE FANNO LA DIFFERENZA</text><rect x="308" y="683" width="21" height="21" rx="5" fill="#4f8f6d"/><text x="315" y="699" class="ui" fill="#fff" font-size="13">1</text><text x="346" y="699" class="ui body" font-weight="700">Standardizzare i processi critici</text><text x="346" y="722" class="ui body" font-size="15">Definire e adottare best practice condivise riduce le variabilità e accelera l’esecuzione.</text>
<rect x="308" y="745" width="21" height="21" rx="5" fill="#4f8f6d"/><text x="315" y="761" class="ui" fill="#fff" font-size="13">2</text><text x="346" y="761" class="ui body" font-weight="700">Allineare obiettivi e responsabilità</text><text x="346" y="784" class="ui body" font-size="15">Obiettivi chiari e ownership definite migliorano la collaborazione e riducono i tempi di attesa.</text>
<rect x="308" y="807" width="21" height="21" rx="5" fill="#4f8f6d"/><text x="315" y="823" class="ui" fill="#fff" font-size="13">3</text><text x="346" y="823" class="ui body" font-weight="700">Monitorare i colli di bottiglia in tempo reale</text><text x="346" y="846" class="ui body" font-size="15">La visibilità continua sui dati di progetto permette interventi tempestivi e mirati.</text>
<line x1="308" y1="870" x2="1138" y2="870" stroke="#dfd2c2"/><text x="308" y="900" class="ui" fill="#6d665e" font-size="14">1.284 parole   ·   6 claim   ·   Ultimo salvataggio: 2 min fa</text><rect x="758" y="888" width="180" height="38" rx="8" fill="#fbf1e5" stroke="#dbc9b6"/><text x="791" y="912" class="ui paperText" font-size="14">✎ Continua a modificare</text><rect x="950" y="888" width="188" height="38" rx="8" fill="#ef541f"/><text x="970" y="912" class="ui btnText" font-size="14">Accetta e pubblica →</text>
<!-- right preview -->
<rect x="1184" y="194" width="326" height="742" rx="16" fill="#141617" stroke="#303234"/><text x="1206" y="227" class="ui cream" font-size="17" font-weight="700">in  Anteprima LinkedIn</text><rect x="1204" y="246" width="286" height="344" rx="12" fill="#fff"/>
<circle cx="1232" cy="276" r="17" fill="#121212"/><circle cx="1232" cy="276" r="6" fill="#f15a24"/><text x="1260" y="272" class="ui" fill="#1e1e1e" font-size="14" font-weight="700">Plinio Studio</text><text x="1260" y="291" class="ui" fill="#777" font-size="11">Adesso · pubblico</text>
<text x="1218" y="322" class="ui" fill="#222" font-size="13" font-weight="700">Come ridurre i tempi ciclo del 12%</text><text x="1218" y="341" class="ui" fill="#222" font-size="13" font-weight="700">e migliorare l’allineamento tra funzioni</text><text x="1218" y="371" class="ui" fill="#333" font-size="12">Dai progetti analizzati emerge un pattern chiaro:</text><text x="1218" y="390" class="ui" fill="#333" font-size="12">le inefficienze non sono dovute alla mancanza</text><text x="1218" y="409" class="ui" fill="#333" font-size="12">di strumenti, ma alla frammentazione delle informazioni.</text><text x="1218" y="438" class="ui" fill="#333" font-size="12">1  Standardizzare i processi critici</text><text x="1218" y="459" class="ui" fill="#333" font-size="12">2  Allineare obiettivi e responsabilità</text><text x="1218" y="480" class="ui" fill="#333" font-size="12">3  Monitorare i colli di bottiglia</text><rect x="1218" y="504" width="258" height="62" rx="6" fill="#11191a"/><text x="1236" y="531" class="serif" fill="#fff" font-size="19">−12% nei tempi ciclo</text><text x="1236" y="550" class="ui" fill="#f15a24" font-size="11">con processi allineati</text>
<text x="1206" y="626" class="ui cream" font-size="16" font-weight="700">Target di riferimento</text><rect x="1206" y="644" width="122" height="34" rx="17" fill="#10271c" stroke="#30724c"/><text x="1221" y="666" class="ui green" font-size="13">◉ Pubblico</text><rect x="1338" y="644" width="88" height="34" rx="17" fill="#1c1d1e" stroke="#f15a24"/><text x="1352" y="666" class="ui cream" font-size="13">in LinkedIn</text><rect x="1436" y="644" width="52" height="34" rx="17" fill="#1c1d1e" stroke="#454545"/><text x="1451" y="666" class="ui muted" font-size="13">IG</text><text x="1206" y="704" class="ui muted" font-size="14">Tono: Professionale, autorevole</text><text x="1206" y="732" class="ui muted" font-size="14">Formato: Post testuale con immagine</text>
<line x1="1206" y1="766" x2="1488" y2="766" stroke="#303234"/><text x="1206" y="800" class="ui cream" font-size="16" font-weight="700">Claim e fonti collegati</text><text x="1442" y="800" class="ui green" font-size="13">3 claim</text><text x="1206" y="832" class="ui muted" font-size="13">✓ Standardizzare i processi critici</text><text x="1206" y="858" class="ui muted" font-size="13">✓ Allineare obiettivi e responsabilità</text><text x="1206" y="884" class="ui muted" font-size="13">✓ Monitorare i colli di bottiglia</text><text x="1392" y="914" class="ui orange" font-size="13">Vedi tutte le fonti →</text>
</svg>