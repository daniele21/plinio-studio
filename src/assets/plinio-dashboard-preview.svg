<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#161412; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E05A2B"/>
      <stop offset="100%" stop-color="#FF7547"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="210" height="620" fill="#12100E"/>
  <line x1="210" y1="0" x2="210" y2="620" stroke="#262320" stroke-width="1"/>

  <!-- Logo Brand in Sidebar -->
  <circle cx="36" cy="36" r="12" fill="#E05A2B"/>
  <circle cx="36" cy="36" r="5" fill="#F5F2EB"/>
  <text x="58" y="42" fill="#F5F2EB" font-size="16" font-weight="700" letter-spacing="-0.3">Plinio</text>

  <!-- Sidebar Nav items -->
  <g transform="translate(18, 80)">
    <!-- Active Nav -->
    <rect x="0" y="0" width="174" height="34" rx="6" fill="#23201D"/>
    <rect x="0" y="8" width="3" height="18" rx="1.5" fill="#E05A2B"/>
    <text x="32" y="22" fill="#F5F2EB" font-size="13" font-weight="600">Progetti attivi</text>
    <circle cx="18" cy="17" r="4" fill="#E05A2B"/>

    <g transform="translate(0, 44)">
      <text x="32" y="20" fill="#8E8881" font-size="13" font-weight="500">Knowledge Base</text>
      <circle cx="18" cy="16" r="3" fill="#504B46"/>
    </g>

    <g transform="translate(0, 80)">
      <text x="32" y="20" fill="#8E8881" font-size="13" font-weight="500">AI Radar (Topic)</text>
      <circle cx="18" cy="16" r="3" fill="#504B46"/>
    </g>

    <g transform="translate(0, 116)">
      <text x="32" y="20" fill="#8E8881" font-size="13" font-weight="500">Bozze &amp; Contenuti</text>
      <circle cx="18" cy="16" r="3" fill="#504B46"/>
    </g>
  </g>

  <!-- Sidebar bottom user info -->
  <g transform="translate(18, 560)">
    <circle cx="14" cy="14" r="14" fill="#2C2824"/>
    <text x="14" y="18" fill="#E05A2B" font-size="11" font-weight="700" text-anchor="middle">PS</text>
    <text x="38" y="14" fill="#F5F2EB" font-size="12" font-weight="600">Studio Science</text>
    <text x="38" y="26" fill="#8E8881" font-size="10">Piano Enterprise</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(230, 24)">
    <!-- Top Header bar inside app -->
    <text x="0" y="22" fill="#F5F2EB" font-size="18" font-weight="700">Progetto: Cloud Migration &amp; Security 2026</text>
    <rect x="580" y="2" width="160" height="30" rx="5" fill="url(#accentGrad)"/>
    <text x="660" y="21" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">+ Estrai nuovi topic</text>

    <!-- 3 Columns Pipeline: Fonti (Sources) -> Topic (Radar) -> Bozza (Draft) -->
    
    <!-- Column 1: Fonti collegate (220px) -->
    <g transform="translate(0, 54)">
      <text x="0" y="16" fill="#8E8881" font-size="11" font-weight="600" letter-spacing="0.5">FONTI COLLEGATE (3)</text>
      
      <!-- Source Card 1 -->
      <g transform="translate(0, 28)" filter="url(#cardShadow)">
        <rect width="220" height="96" rx="8" fill="#1C1917" stroke="#2D2925" stroke-width="1"/>
        <rect x="12" y="12" width="24" height="24" rx="4" fill="#282420"/>
        <text x="24" y="28" fill="#FF7547" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
        <text x="44" y="24" fill="#F5F2EB" font-size="12" font-weight="600">Report_Delivery_Q4.pdf</text>
        <text x="44" y="38" fill="#8E8881" font-size="10">48 pagine · 14 claim estratti</text>
        <rect x="12" y="66" width="76" height="18" rx="3" fill="#25211D"/>
        <text x="50" y="79" fill="#5BA866" font-size="9" font-weight="600" text-anchor="middle">✓ Validato</text>
      </g>

      <!-- Source Card 2 -->
      <g transform="translate(0, 136)" filter="url(#cardShadow)">
        <rect width="220" height="96" rx="8" fill="#1C1917" stroke="#2D2925" stroke-width="1"/>
        <rect x="12" y="12" width="24" height="24" rx="4" fill="#282420"/>
        <text x="24" y="28" fill="#FF7547" font-size="10" font-weight="700" text-anchor="middle">DOC</text>
        <text x="44" y="24" fill="#F5F2EB" font-size="12" font-weight="600">Architettura_Cloud.docx</text>
        <text x="44" y="38" fill="#8E8881" font-size="10">Metriche di downtime -99.9%</text>
        <rect x="12" y="66" width="76" height="18" rx="3" fill="#25211D"/>
        <text x="50" y="79" fill="#5BA866" font-size="9" font-weight="600" text-anchor="middle">✓ Validato</text>
      </g>
    </g>

    <!-- Column 2: Topic proposti dall'AI Radar (240px) -->
    <g transform="translate(240, 54)">
      <text x="0" y="16" fill="#FF7547" font-size="11" font-weight="700" letter-spacing="0.5">OPPORTUNITÀ INDIVIDUATE (3)</text>

      <!-- Topic Card 1 (Selected) -->
      <g transform="translate(0, 28)" filter="url(#cardShadow)">
        <rect width="240" height="150" rx="8" fill="#231F1C" stroke="#E05A2B" stroke-width="1.5"/>
        <rect x="12" y="12" width="68" height="18" rx="3" fill="rgba(224,90,43,0.22)"/>
        <text x="46" y="24" fill="#FF7547" font-size="9" font-weight="700" text-anchor="middle">CASE STUDY</text>
        
        <text x="12" y="52" fill="#F5F2EB" font-size="13" font-weight="700">Come abbiamo azzerato</text>
        <text x="12" y="68" fill="#F5F2EB" font-size="13" font-weight="700">il downtime nella migrazione</text>
        
        <text x="12" y="92" fill="#8E8881" font-size="11">Angolo: ROI architetturale per CTO</text>
        
        <line x1="12" y1="112" x2="228" y2="112" stroke="#332E2A" stroke-width="1"/>
        <text x="12" y="132" fill="#5BA866" font-size="10" font-weight="600">3 fonti collegate · 100% citato</text>
      </g>

      <!-- Topic Card 2 -->
      <g transform="translate(0, 190)" filter="url(#cardShadow)">
        <rect width="240" height="110" rx="8" fill="#1C1917" stroke="#2D2925" stroke-width="1"/>
        <rect x="12" y="12" width="76" height="18" rx="3" fill="#25211D"/>
        <text x="50" y="24" fill="#8E8881" font-size="9" font-weight="600" text-anchor="middle">THOUGHT LEAD</text>
        <text x="12" y="50" fill="#F5F2EB" font-size="12" font-weight="600">I 4 errori tipici nei bandi B2B</text>
        <text x="12" y="70" fill="#8E8881" font-size="10">Target: C-level &amp; Procurement</text>
      </g>
    </g>

    <!-- Column 3: Prima Bozza Generata (260px) -->
    <g transform="translate(500, 54)">
      <text x="0" y="16" fill="#8E8881" font-size="11" font-weight="600" letter-spacing="0.5">PRIMA BOZZA (GENERATA)</text>

      <g transform="translate(0, 28)" filter="url(#cardShadow)">
        <rect width="250" height="470" rx="8" fill="#1C1917" stroke="#2D2925" stroke-width="1"/>
        
        <!-- Draft Header -->
        <text x="16" y="28" fill="#8E8881" font-size="10" font-weight="600">TITOLO PROPOSTO</text>
        <text x="16" y="48" fill="#F5F2EB" font-size="13" font-weight="700">Zero Downtime Migration:</text>
        <text x="16" y="64" fill="#F5F2EB" font-size="13" font-weight="700">Lezioni dal Progetto Cloud 2026</text>

        <line x1="16" y1="80" x2="234" y2="80" stroke="#2D2925" stroke-width="1"/>

        <!-- Draft Body Lines with source highlights in Orange -->
        <text x="16" y="104" fill="#D4CEC7" font-size="11">Durante l'ultimo trimestre abbiamo</text>
        <text x="16" y="122" fill="#D4CEC7" font-size="11">completato la migrazione di</text>
        
        <!-- Highlighted text & orange citation pill -->
        <rect x="16" y="130" width="160" height="18" fill="rgba(224,90,43,0.22)" rx="2"/>
        <text x="18" y="143" fill="#FF7547" font-size="11" font-weight="700">oltre 40TB di dati bancari</text>
        <rect x="180" y="130" width="50" height="18" fill="#E05A2B" rx="3"/>
        <text x="205" y="143" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">[Fonte 1]</text>

        <text x="16" y="170" fill="#D4CEC7" font-size="11">garantendo una continuità operativa</text>
        <text x="16" y="188" fill="#D4CEC7" font-size="11">superiore al 99.98%.</text>

        <!-- Another citation pill in Orange -->
        <rect x="16" y="202" width="145" height="18" fill="rgba(224,90,43,0.22)" rx="2"/>
        <text x="18" y="215" fill="#FF7547" font-size="11" font-weight="700">-40% di overhead IT</text>
        <rect x="165" y="202" width="50" height="18" fill="#E05A2B" rx="3"/>
        <text x="190" y="215" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">[Fonte 2]</text>

        <rect x="16" y="420" width="218" height="34" rx="5" fill="#2C2824" stroke="#3D3732" stroke-width="1"/>
        <text x="125" y="442" fill="#F5F2EB" font-size="11" font-weight="600" text-anchor="middle">Approva &amp; Esporta per LinkedIn</text>
      </g>
    </g>
  </g>
</svg>
