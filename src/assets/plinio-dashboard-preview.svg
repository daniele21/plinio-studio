<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#12100E; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Left Sidebar (Warm Obsidian #12100E) -->
  <rect x="0" y="0" width="210" height="620" fill="#12100E"/>
  <line x1="210" y1="0" x2="210" y2="620" stroke="#24201C" stroke-width="1"/>

  <!-- Logo Brand in Sidebar -->
  <g transform="translate(24, 28)">
    <circle cx="12" cy="12" r="10" fill="#D65527"/>
    <ellipse cx="12" cy="12" rx="16" ry="7" transform="rotate(-38 12 12)" fill="none" stroke="#F7EFDD" stroke-width="1.2"/>
    <text x="32" y="18" fill="#F5F2EB" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" letter-spacing="-0.5">Plinio</text>
  </g>

  <!-- Sidebar Nav items -->
  <g transform="translate(18, 76)">
    <!-- Active Nav -->
    <rect x="0" y="0" width="174" height="34" rx="6" fill="#1A1715" stroke="#2D2824" stroke-width="1"/>
    <rect x="0" y="8" width="3" height="18" rx="1.5" fill="#D65527"/>
    <text x="32" y="22" fill="#F5F2EB" font-size="13" font-weight="600">Progetti attivi</text>
    <circle cx="18" cy="17" r="3.5" fill="#D65527"/>

    <g transform="translate(0, 44)">
      <text x="32" y="20" fill="#9C8A78" font-size="13" font-weight="500">Knowledge Base</text>
      <circle cx="18" cy="16" r="3" fill="#3D3732"/>
    </g>

    <g transform="translate(0, 80)">
      <text x="32" y="20" fill="#9C8A78" font-size="13" font-weight="500">AI Radar (Topic)</text>
      <circle cx="18" cy="16" r="3" fill="#3D3732"/>
    </g>

    <g transform="translate(0, 116)">
      <text x="32" y="20" fill="#9C8A78" font-size="13" font-weight="500">Bozze &amp; Contenuti</text>
      <circle cx="18" cy="16" r="3" fill="#3D3732"/>
    </g>
  </g>

  <!-- Sidebar bottom user info -->
  <g transform="translate(18, 560)">
    <circle cx="14" cy="14" r="14" fill="#24201C"/>
    <text x="14" y="18" fill="#D65527" font-size="11" font-weight="700" text-anchor="middle">PS</text>
    <text x="38" y="13" fill="#F5F2EB" font-size="12" font-weight="600">Studio Science</text>
    <text x="38" y="26" fill="#9C8A78" font-size="10" font-family="'Cutive Mono', monospace">PIANO ENTERPRISE</text>
  </g>

  <!-- Main Content Area (Warm Obsidian) -->
  <g transform="translate(230, 24)">
    <!-- Top Header bar inside app -->
    <text x="0" y="22" fill="#F5F2EB" font-size="17" font-weight="700">Progetto: Cloud Migration &amp; Security 2026</text>
    <rect x="580" y="0" width="164" height="32" rx="6" fill="#D65527"/>
    <text x="662" y="20" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">+ Estrai opportunità</text>

    <!-- 3 Columns Pipeline: Fonti (Sources) -> Opportunità (Radar) -> Bozza (Draft) -->
    
    <!-- Column 1: Fonti collegate (220px) -->
    <g transform="translate(0, 54)">
      <text x="0" y="16" fill="#9C8A78" font-size="11" font-weight="600" font-family="'Cutive Mono', monospace" letter-spacing="0.5">01 · FONTI COLLEGATE (3)</text>
      
      <!-- Source Card 1 -->
      <g transform="translate(0, 28)" filter="url(#cardShadow)">
        <rect width="220" height="96" rx="8" fill="#1A1715" stroke="#2D2824" stroke-width="1"/>
        <rect x="12" y="12" width="26" height="24" rx="4" fill="#24201C"/>
        <text x="25" y="28" fill="#FF7547" font-size="10" font-weight="700" font-family="'Cutive Mono', monospace" text-anchor="middle">PDF</text>
        <text x="46" y="24" fill="#F5F2EB" font-size="12" font-weight="600">Report_Delivery_Q4.pdf</text>
        <text x="46" y="38" fill="#9C8A78" font-size="10">48 pagine · 14 fatti estratti</text>
        
        <!-- Evidence Verified Pill in Verification Sage #679A92 -->
        <rect x="12" y="66" width="92" height="18" rx="4" fill="rgba(103,154,146,0.16)" stroke="rgba(103,154,146,0.3)"/>
        <text x="58" y="79" fill="#679A92" font-size="9" font-weight="600" text-anchor="middle">✓ Fonte verificata</text>
      </g>

      <!-- Source Card 2 -->
      <g transform="translate(0, 136)" filter="url(#cardShadow)">
        <rect width="220" height="96" rx="8" fill="#1A1715" stroke="#2D2824" stroke-width="1"/>
        <rect x="12" y="12" width="26" height="24" rx="4" fill="#24201C"/>
        <text x="25" y="28" fill="#FF7547" font-size="10" font-weight="700" font-family="'Cutive Mono', monospace" text-anchor="middle">DOC</text>
        <text x="46" y="24" fill="#F5F2EB" font-size="12" font-weight="600">Architettura_Cloud.docx</text>
        <text x="46" y="38" fill="#9C8A78" font-size="10">Downtime azzerato (-99.9%)</text>
        
        <rect x="12" y="66" width="92" height="18" rx="4" fill="rgba(103,154,146,0.16)" stroke="rgba(103,154,146,0.3)"/>
        <text x="58" y="79" fill="#679A92" font-size="9" font-weight="600" text-anchor="middle">✓ Fonte verificata</text>
      </g>
    </g>

    <!-- Column 2: Topic proposti dall'AI Radar (240px) -->
    <g transform="translate(240, 54)">
      <text x="0" y="16" fill="#DE9379" font-size="11" font-weight="700" font-family="'Cutive Mono', monospace" letter-spacing="0.5">02 · OPPORTUNITÀ (3)</text>

      <!-- Topic Card 1 (Selected) -->
      <g transform="translate(0, 28)" filter="url(#cardShadow)">
        <rect width="240" height="152" rx="8" fill="#201C19" stroke="#D65527" stroke-width="1.5"/>
        <rect x="12" y="12" width="76" height="18" rx="3" fill="rgba(214,85,39,0.2)"/>
        <text x="50" y="24" fill="#FF7547" font-size="9" font-weight="700" font-family="'Cutive Mono', monospace" text-anchor="middle">CASE STUDY</text>
        
        <text x="12" y="52" fill="#F5F2EB" font-size="13" font-weight="700">Come abbiamo azzerato</text>
        <text x="12" y="68" fill="#F5F2EB" font-size="13" font-weight="700">il downtime nella migrazione</text>
        
        <text x="12" y="92" fill="#9C8A78" font-size="11">Angolo: ROI architetturale per CTO</text>
        
        <line x1="12" y1="112" x2="228" y2="112" stroke="#2D2824" stroke-width="1"/>
        
        <!-- Evidence Matched Indicator -->
        <circle cx="18" cy="132" r="3.5" fill="#679A92"/>
        <text x="28" y="135" fill="#679A92" font-size="10" font-weight="600">3 fonti collegate · 100% citato</text>
      </g>

      <!-- Topic Card 2 -->
      <g transform="translate(0, 192)" filter="url(#cardShadow)">
        <rect width="240" height="110" rx="8" fill="#1A1715" stroke="#2D2824" stroke-width="1"/>
        <rect x="12" y="12" width="88" height="18" rx="3" fill="#24201C"/>
        <text x="56" y="24" fill="#9C8A78" font-size="9" font-weight="600" font-family="'Cutive Mono', monospace" text-anchor="middle">THOUGHT LEAD</text>
        <text x="12" y="50" fill="#F5F2EB" font-size="12" font-weight="600">I 4 errori tipici nei bandi B2B</text>
        <text x="12" y="70" fill="#9C8A78" font-size="10">Target: C-level &amp; Procurement</text>
      </g>
    </g>

    <!-- Column 3: Prima Bozza Generata (250px) -->
    <g transform="translate(500, 54)">
      <text x="0" y="16" fill="#9C8A78" font-size="11" font-weight="600" font-family="'Cutive Mono', monospace" letter-spacing="0.5">03 · PRIMA BOZZA (GENERATA)</text>

      <g transform="translate(0, 28)" filter="url(#cardShadow)">
        <rect width="250" height="470" rx="8" fill="#1A1715" stroke="#2D2824" stroke-width="1"/>
        
        <!-- Draft Header -->
        <text x="16" y="28" fill="#9C8A78" font-size="10" font-weight="600" font-family="'Cutive Mono', monospace">TITOLO PROPOSTO</text>
        <text x="16" y="48" fill="#F5F2EB" font-size="13" font-weight="700">Zero Downtime Migration:</text>
        <text x="16" y="64" fill="#F5F2EB" font-size="13" font-weight="700">Lezioni dal Progetto Cloud 2026</text>

        <line x1="16" y1="80" x2="234" y2="80" stroke="#2D2824" stroke-width="1"/>

        <!-- Draft Body Lines with source highlights in Soft Terracotta -->
        <text x="16" y="104" fill="#D4CEC7" font-size="11">Durante l'ultimo trimestre abbiamo</text>
        <text x="16" y="122" fill="#D4CEC7" font-size="11">completato la migrazione di</text>
        
        <!-- Highlighted text & terracotta citation pill -->
        <rect x="16" y="130" width="156" height="18" fill="rgba(214,85,39,0.18)" rx="3"/>
        <text x="18" y="143" fill="#DE9379" font-size="11" font-weight="600">oltre 40TB di dati bancari</text>
        <rect x="176" y="130" width="56" height="18" fill="#24201C" stroke="rgba(214,85,39,0.4)" rx="3"/>
        <text x="204" y="143" fill="#DE9379" font-size="9" font-weight="700" font-family="'Cutive Mono', monospace" text-anchor="middle">[Doc 1]</text>

        <text x="16" y="170" fill="#D4CEC7" font-size="11">garantendo una continuità operativa</text>
        <text x="16" y="188" fill="#D4CEC7" font-size="11">superiore al 99.98%.</text>

        <!-- Another citation pill in Terracotta -->
        <rect x="16" y="202" width="140" height="18" fill="rgba(214,85,39,0.18)" rx="3"/>
        <text x="18" y="215" fill="#DE9379" font-size="11" font-weight="600">-40% di overhead IT</text>
        <rect x="160" y="202" width="56" height="18" fill="#24201C" stroke="rgba(214,85,39,0.4)" rx="3"/>
        <text x="188" y="215" fill="#DE9379" font-size="9" font-weight="700" font-family="'Cutive Mono', monospace" text-anchor="middle">[Doc 2]</text>

        <!-- Action Button -->
        <rect x="16" y="420" width="218" height="34" rx="6" fill="#D65527"/>
        <text x="125" y="442" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Approva bozza &amp; Esporta →</text>
      </g>
    </g>
  </g>
</svg>
